project_id = "wentenbbm"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true

[storage.buckets.snapshots]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["application/json"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3001/auth/callback"]
enable_anonymous_sign_ins = true
enable_signup = true

[auth.rate_limit]
# batas pembuatan sesi anonim per IP per jam (ARCHITECTURE.md 4.1)
anonymous_users = 30

[auth.email]
enable_signup = true
enable_confirmations = false

# Turnstile: isi secret di produksi (ARCHITECTURE.md 6)
# [auth.captcha]
# enabled = true
# provider = "turnstile"
# secret = "env(TURNSTILE_SECRET_KEY)"

[edge_runtime]
enabled = true

[functions.uptime-webhook]
verify_jwt = false
